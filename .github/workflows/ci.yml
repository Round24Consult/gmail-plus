name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Set under Settings → Secrets and variables → Actions → Variables.
      # Forks without it still build; Gmail just shows InboxSDK's developer banner.
      INBOXSDK_APP_ID: ${{ vars.INBOXSDK_APP_ID }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build and zip
        run: npm run package

      - name: Upload extension zip
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error
