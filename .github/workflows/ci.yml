name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build and zip
        run: npm run package

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: gmail-plus-extension
          path: release/*.zip
          if-no-files-found: error
